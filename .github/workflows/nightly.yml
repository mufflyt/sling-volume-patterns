name: nightly

# Runs every night and on demand. This is an environment-and-code check, not a
# full reproduction: the analysis cache (data/cache/) and the ~30 GB of raw CMS
# CSVs are not in version control, so tests that need them skip rather than
# fail. A green run therefore means "the locked environment still restores and
# the cache-independent code still behaves", which is the failure mode that has
# actually bitten this project (renv library loss, package drift).
#
# The full suite, including the golden-value assertions on the 1,467-physician
# cohort, only runs locally where the cache exists.

on:
  schedule:
    # 08:00 UTC = 02:00 America/Denver during MDT. GitHub may delay scheduled
    # runs under load; this is a heartbeat, not a deadline.
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'renv.lock'
      - '.github/workflows/nightly.yml'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4.0']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Build dependencies for the packages in renv.lock that compile:
      # textshaping/systemfonts/svglite need harfbuzz, fribidi and freetype;
      # xml2 needs libxml2. On Linux, PPM serves binaries for most of the
      # lockfile, so unlike a macOS restore this does NOT need gfortran.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev libxml2-dev \
            libcurl4-openssl-dev libssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: |
          Rscript -e 'sessionInfo()'
          Rscript -e 'cat("renv packages installed:", length(renv::status()$library$Packages), "\n")'

      - name: Run test suite
        run: |
          Rscript -e '
            res <- testthat::test_dir("tests/testthat", stop_on_failure = FALSE, reporter = "summary")
            df  <- as.data.frame(res)
            cat("\n---- summary ----\n")
            cat("PASS:", sum(df$passed), " FAIL:", sum(df$failed),
                " SKIP:", sum(df$skipped), "\n")
            if (sum(df$failed) > 0 || sum(df$error) > 0) quit(status = 1)
          '

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Catches the failure this repo actually had: README images pointing into
      # a gitignored directory, so they rendered as broken on GitHub.
      - name: Check local file references resolve
        run: |
          set -uo pipefail
          broken=0
          for f in README.md NEWS.md CHANGELOG.md docs/STROBE_checklist.md data/README.md; do
            [ -f "$f" ] || continue
            # The regex excludes ':' so absolute URLs never match here; they are
            # the next step's job. A file with only absolute URLs therefore
            # yields no matches and grep exits 1, which is not an error. Without
            # the `|| true` that exit status trips pipefail and fails the job.
            links=$(grep -oE '\]\(([^)#:]+)\)' "$f" | sed -E 's/^\]\(//; s/\)$//' || true)
            [ -n "$links" ] || continue
            # Fed by here-string rather than a pipe so the loop runs in this
            # shell and `broken` survives it.
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              if [ ! -e "$p" ]; then
                echo "BROKEN in $f -> $p"
                broken=1
              fi
            done <<< "$links"
          done
          [ "$broken" -eq 0 ] && echo "all local file references resolve"
          exit $broken

      - name: Check external URLs
        continue-on-error: true
        run: |
          grep -ohE 'https://[^)>` "]+' README.md NEWS.md CHANGELOG.md CITATION.cff LICENSE \
            | sed 's/[.,]$//' | sort -u > urls.txt
          echo "checking $(wc -l < urls.txt) URLs"
          fail=0
          while read -r u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 \
                   -A 'Mozilla/5.0 (nightly-link-check)' "$u" || echo 000)
            case "$code" in
              2*|3*) ;;
              403) echo "note $code $u (bot-blocked, likely fine)" ;;
              *)   echo "FAIL $code $u"; fail=1 ;;
            esac
          done < urls.txt
          exit $fail
