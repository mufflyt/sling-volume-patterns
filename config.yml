# =============================================================================
# config.yml
#
# Single source of truth for all parameters in the midurethral sling
# pipeline.  Every script reads this file via config::get(); no magic
# numbers are scattered across individual scripts.
#
# Usage in R:
#   cfg <- config::get()
#   cfg$hcpcs_sling_code   # "57288"
#   cfg$puf_years          # c(2017, 2018, ..., 2023)
#
# Pattern from mkiang/opioid_geographic (JAMA Network Open 2019).
# =============================================================================

default:
  # ── Procedure ──────────────────────────────────────────────────────────────
  hcpcs_sling_code: "57288"

  # ── Study years ────────────────────────────────────────────────────────────
  puf_years:
    - 2013
    - 2014
    - 2015
    - 2016
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    - 2022
    - 2023
  study_start_year: 2013
  study_end_year:   2023
  # Calendar years to drop from the analysis for data-quality reasons.
  # 2017 was previously excluded because the raw D17 PUF download was truncated
  # (1.5 GB vs ~2.7 GB; ~376 sling provider-rows). The complete 2017 file was
  # re-downloaded (745 sling provider-rows, ~16,200 procedures) and merged into
  # the cache on 2026-07-21, so all 11 years are now analyzed.
  exclude_years: []
  # Column name added to the merged PUF in 01_build_puf_cache.R.
  # Must match the mutate() call in that script.
  # Bug fix B8: hardcoded "puf_year" in 05_generate_abstract.R now
  # reads this value so both scripts stay in sync.
  year_col_name: "puf_year"

  # ── Concentration analysis ─────────────────────────────────────────────────
  # Top-N% cutoffs for computing "share of procedures by top X% of providers".
  # Gini coefficient is always computed (no cutoff needed).
  concentration_cutoffs:
    - 10
    - 20
    - 30

  # ── Specialty classification ────────────────────────────────────────────────
  # NOTE (Bug fix B3): specialty_regex was previously defined here but was
  # NEVER READ by classify_provider_specialty() in analyze_sling_patterns.R,
  # which hardcodes its patterns. Leaving YAML values that have no effect
  # creates a false impression of parameterisation — a silent no-op if changed.
  # The regex patterns remain hardcoded in the R function. This block has been
  # removed to prevent confusion. To change classification, edit
  # classify_provider_specialty() in R/analyze_sling_patterns.R directly.

  # ── CMS data suppression threshold ─────────────────────────────────────────
  # Bug fix B4: old comment said "Flag rows at or below this" (implying <=),
  # but the code uses < threshold. With threshold=11 and <, rows 1-10 are
  # flagged, which is correct. Comment updated to match the actual operator.
  # CMS suppresses cells with 1-10 services (Tot_Srvcs < this value is flagged).
  cms_suppression_threshold: 11

  # ── File paths ──────────────────────────────────────────────────────────────
  # All paths are relative to the project root.  Swap data_dir to point at
  # your external drive when running on a Mac with PUF files mounted.
  data_dir:       "data"
  raw_data_dir:   "data/raw"
  proc_data_dir:  "data/processed"
  output_dir:     "output"
  figures_dir:    "output/figures"
  tables_dir:     "output/tables"
  cache_dir:      "data/cache"
  abog_npi_csv:   "data/canonical_abog/canonical_abog_npi_LATEST.csv"
  # ABU (American Board of Urology) urology-pathway URPS/FPMRS roster.
  # These fellowship-trained urogynecologists entered via a urology residency,
  # are absent from the ABOG (OB/GYN) registry, and appear only as "Urology" in
  # the CMS PUF. Cross-referencing this list folds them into the combined URPS
  # group (see analyze_midurethral_sling_patterns Step 2c). Set to a non-string
  # (e.g. remove the line) to disable and keep them inside Urology.
  # Source: isochrones repo ABU pipeline (abu_urps_active_with_gender_*).
  urps_urology_npi_csv: "data/abu_urology/abu_urps_npi_LATEST.csv"
  # ABOG subspecialty (FPMRS/MIG) certification-year crosswalk, derived from the
  # ABOG `sub1startdate` field (the true subspecialty cert date, 2013-2024, not
  # the initial OB/GYN board date). Columns: npi, subspecialty (URPS/MIGS),
  # cert_year. Enables the time-varying cert-gated classification in
  # scripts/classification_sensitivity.R (a physician counts as URPS/MIGS only
  # from their certification year onward).
  abog_subspecialty_certyear_csv: "data/canonical_abog/abog_subspecialty_certyear_LATEST.csv"

  # Female Original Medicare (fee-for-service) enrollment denominator, by year.
  # Source: CMS Program Statistics - Original Medicare Enrollment, table
  # MDCR ENROLL AB 11 (Sex -> Female). Column `female_ffs_partB` is the primary
  # denominator for CPT 57288 services per 100,000 female Part B FFS
  # beneficiaries. See data/denominator/README.md for provenance.
  ffs_denominator_csv: "data/denominator/female_ffs_denominator.csv"

  # ── Specialty-classification options (single source of truth) ──────────────
  # Set these once here; every analysis path (pipeline step 03, the manuscript
  # values function, and the supplementary-table scripts) reads them, so the
  # main and supplementary outputs cannot drift apart.
  #   other_handling: how to treat CPT 57288 billers that are neither OB/GYN nor
  #     urology and not in ABOG ("separate" = drop organizations/facilities and
  #     put remaining clinicians in an Other/uncertain group; "exclude"; or the
  #     legacy "urology").
  #   split_urps_pathway: TRUE splits URPS into OB/GYN-pathway (ABOG) and
  #     urology-pathway (ABU) groups; FALSE keeps a single combined URPS group.
  other_handling: "exclude"
  split_urps_pathway: yes

  # ── Data provenance (Pattern 4: data_raw/ README) ──────────────────────────
  # data_raw/ holds original CMS downloads; never modified after download.
  # data_raw_readme documents exact URLs, file hashes, and download dates.
  # Use here::here() (Pattern 4: mkiang lab) for portable path construction:
  #   here::here("data", "raw", "Medicare_Provider_Utilization_2023.csv")
  data_raw_readme: "data/raw/README.md"

  # ── Parallelisation (Pattern 2: furrr/future) ──────────────────────────────
  # Set proc_in_parallel: true and num_cores > 1 to parallelize the
  # sensitivity grid (04_run_sensitivity_analyses.R) using furrr::future_map().
  # On a 4-core Mac: num_cores: 4. On a 2-core machine: num_cores: 2.
  # future::plan(sequential) is used when proc_in_parallel: false.
  proc_in_parallel: false
  num_cores: 1

  # ── Reproducibility seed ────────────────────────────────────────────────────
  seed: 20240101

  # ── Logging ─────────────────────────────────────────────────────────────────
  verbose: true
